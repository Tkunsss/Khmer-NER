name = "khmer-ner-api"
main = "worker.js"
compatibility_date = "2026-11-03"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "khmer-ner"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "DOCS"
bucket_name = "khmer-ner-documents"
